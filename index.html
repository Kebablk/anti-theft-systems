<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" type="text/css" href="feedbackForms.css" />
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <h2>Наши отзывы</h2>
      </section>
      <section id="form-feedback">
        <div class="feedback-page">
          <div class="formBlock">
            <span class="leave-feadback">Оставить отзыв</span>
            <input
              class="input-for-name"
              type="text"
              placeholder="Ваше имя: "
              required
            />
            <input
              class="input-for-surname"
              type="text"
              placeholder="Ваша фамилия: "
              required
            />
            <div class="fileBox">
              <span class="file">Файл: </span> <br />
              <input type="file" class="FileButton" />
            </div>
            <textarea class="feadbackBox" placeholder="Оставить отзыв"></textarea>
            <div class="privacy">
              <input type="checkbox" required />
              <span
                >Я согласен на
                <span class="magicText">обработку персональных данных</span></span
              >
            </div>
            <button type="button" class="btn-send">Отправить</button>
          </div>
        </div>
    </main>
  </body>
</html>
